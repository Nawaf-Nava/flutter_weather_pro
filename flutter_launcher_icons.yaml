flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/weather_app_icon.png"
  min_sdk_android: 21
  
  # تكوين الأيقونة التكيفية لأندرويد (Adaptive Icons)
  adaptive_icon_background: "#020617"
  adaptive_icon_foreground: "assets/icon/weather_app_icon_foreground.png"
  
  # تكوين أيقونة متصفحات الويب (Web Favicon & PWA)
  web:
    generate: true
    image_path: "assets/icon/weather_app_icon.png"
    background_color: "#020617"
    theme_color: "#0ea5e9"
  
  # تكوين أجهزة آبل (macOS & iPad)
  macos:
    generate: true
    image_path: "assets/icon/weather_app_icon.png"