name: dart_weather_app
description: "A comprehensive modern Weather mobile application built with Dart and Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Local Storage & Persistence (تخزين محلي للمدن والإعدادات)
  shared_preferences: ^2.2.2

  # Networking & APIs
  http: ^1.2.0
  dio: ^5.4.1

  # Location & Geocoding
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # Typography & Animations
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  lottie: ^3.1.0

  # Charts & Data Visualization
  fl_chart: ^0.66.2

  # Date & Localization
  intl: ^0.20.0

  # Sound & Ambience
  just_audio: ^0.9.36

  # Push Notifications & Cloud Messaging
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.19
  flutter_local_notifications: ^17.1.0

  # Home & Lock Screen Widgets (iOS WidgetKit & Android AppWidget)
  home_widget: ^0.6.0

  # In-App Purchases & Paywall (RevenueCat)
  purchases_flutter: ^7.0.0

  # Robust Offline DB Cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/weather_icons/
    - assets/audio/